<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Pengembangan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }
        .fullscreen {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* memenuhi layar */
        }
    </style>
</head>
<body>

<div class="fullscreen">
    <img src="img/Halaman ini masih dalam pengembangan.png" alt="Dalam Pengembangan">
</div>

</body>
</html>
