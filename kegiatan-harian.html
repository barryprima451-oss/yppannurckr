<script>
// NOTIFIKASI BERITA BARU (otomatis per pengguna, pakai localStorage)
(function() {
    if (typeof CURRENT_NEWS_VERSION === "undefined") return;

    const badge = document.getElementById("badgeBerita");
    const link = document.getElementById("footerBeritaLink");
    if (!badge || !link) return;

    const lastSeen = parseInt(localStorage.getItem("lastSeenNewsVersion") || "0", 10);
    const unseen = CURRENT_NEWS_VERSION - lastSeen;

    if (unseen > 0) {
        badge.textContent = unseen;
        badge.style.display = "inline-block";
    }

    link.addEventListener("click", function() {
        localStorage.setItem("lastSeenNewsVersion", String(CURRENT_NEWS_VERSION));
        badge.style.display = "none";
    });
})();
</script>
