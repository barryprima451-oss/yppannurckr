<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guru & Staf</title>
<style>
body{font-family:Arial;margin:0;padding:0;background:#f5f5f5;}
.header{background:#2e7d32;color:white;padding:15px;text-align:center;font-size:20px;font-weight:bold;}
.container{padding:15px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;}
.card{background:white;padding:10px;border-radius:10px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px;}
.name{font-size:16px;font-weight:bold;margin-top:8px;}
.job{font-size:14px;color:#555;}
</style>
</head>
<body>
<div class="header">Daftar Guru & Staf</div>
<div class="container">
<div class="grid">
<div class="card">
<img src="img/guru/guru1.jpg">
<div class="name">Nama Guru 1</div>
<div class="job">Guru Mapel</div>
</div>
<div class="card">
<img src="img/guru/guru2.jpg">
<div class="name">Nama Guru 2</div>
<div class="job">Guru Mapel</div>
</div>
<div class="card">
<img src="img/guru/staf1.jpg">
<div class="name">Nama Staf 1</div>
<div class="job">Tata Usaha</div>
</div>
</div>
</div>
</body>
</html>
