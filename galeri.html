<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Galeri - YPP An-Nur Al-Mustafa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-menu {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        @media (min-width: 768px) {
            .gallery-menu {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        .gallery-card {
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .gallery-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        .gallery-card h3 {
            margin: 0;
            padding: 12px;
            font-size: 18px;
            text-align: center;
            background: #f4f4f4;
            font-weight: 600;
        }
        .gallery-card:hover {
            transform: translateY(-5px);
        }
        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
    <script src="config.js"></script>
</head>
<body>

<header>
    <div class="header-inner">
        <img src="LOGO_SEKOLAH.png" class="school-logo" alt="Logo YPP An-Nur Al-Mustafa">
        <div class="header-text">
            <div class="school-title">YPP An-Nur Al-Mustafa</div>
            <div class="school-title">Cikarang Barat</div>
        </div>
    </div>
</header>

<main class="container">
    <div class="page-hero-img">
        <img src="https://picsum.photos/id/1003/800/400" alt="Foto Kegiatan">
    </div>

    <h2 class="page-title">Pilihan Galeri</h2>

    <div class="gallery-menu">

        <a href="galeri-kegiatan.html">
            <div class="gallery-card">
                <img src="https://picsum.photos/400/200?random=51" alt="Galeri Kegiatan Belajar">
                <h3>Kegiatan Belajar</h3>
            </div>
        </a>

        <a href="galeri-prestasi.html">
            <div class="gallery-card">
                <img src="https://picsum.photos/400/200?random=52" alt="Galeri Prestasi Siswa">
                <h3>Prestasi Siswa</h3>
            </div>
        </a>

        <a href="galeri-ekstrakurikuler.html">
            <div class="gallery-card">
                <img src="https://picsum.photos/400/200?random=53" alt="Galeri Ekstrakurikuler">
                <h3>Ekstrakurikuler</h3>
            </div>
        </a>

    </div>
</main>

<nav class="footer-nav">
    <div class="footer-nav-inner">
        <a href="index.html">
            <div class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-house"></i></span>Beranda
            </div>
        </a>
        <a href="profil.html">
            <div class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-building-columns"></i></span>Profil
            </div>
        </a>
        <a href="berita.html" id="footerBeritaLink">
            <div class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-newspaper"></i></span>Berita
                <span id="badgeBerita" class="footer-badge" style="display:none;">0</span>
            </div>
        </a>
        <a href="galeri.html">
            <div class="nav-item active">
                <span class="nav-icon"><i class="fa-solid fa-image"></i></span>Galeri
            </div>
        </a>
        <a href="https://forms.gle/CONTOH_LINK_PPDB" target="_blank">
            <div class="nav-item">
                <span class="nav-icon"><i class="fa-solid fa-user-plus"></i></span>PPDB
            </div>
        </a>
    </div>
</nav>


<script>
// NOTIFIKASI BERITA BARU (otomatis per pengguna, pakai localStorage)
(function() {
    if (typeof CURRENT_NEWS_VERSION === "undefined") return;

    const badge = document.getElementById("badgeBerita");
    const link = document.getElementById("footerBeritaLink");
    if (!badge || !link) return;

    const lastSeen = parseInt(localStorage.getItem("lastSeenNewsVersion") || "0", 10);
    const unseen = CURRENT_NEWS_VERSION - lastSeen;

    if (unseen > 0) {
        badge.textContent = unseen;
        badge.style.display = "inline-block";
    }

    link.addEventListener("click", function() {
        localStorage.setItem("lastSeenNewsVersion", String(CURRENT_NEWS_VERSION));
        badge.style.display = "none";
    });
})();
</script>
</body>
</html>
